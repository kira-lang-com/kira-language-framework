[package]
name = "klf-native-rt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
klf-defsvc = { path = "../klf-defsvc" }
klf-diag = { path = "../klf-diag" }
klf-host-files = { path = "../klf-host-files" }
klf-host-crypto = { path = "../klf-host-crypto" }
klf-host-net = { path = "../klf-host-net" }
klf-host-process = { path = "../klf-host-process" }
klf-ridl = { path = "../klf-ridl" }
klf-rt = { path = "../klf-rt" }
klf-target = { path = "../klf-target" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
