name: Release

# klf for every host it runs on: `cargo xtask release` lays out the
# distribution with the RIDL LLVM and packs it as `klf-<version>-<host>.tar.gz`
# beside a `.sha256`, the archive `klf setup` and `knvm klf install` fetch. A
# tag `v<version>` publishes; a manual run builds, and publishes when asked.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, as `26.10.4`"
        required: true
        type: string
      publish:
        description: "Publish the release after the build succeeds"
        required: false
        default: false
        type: boolean
      skip_platform:
        description: "Platform to omit from this run"
        required: true
        default: none
        type: choice
        options: [none, macos, linux, windows]
      from_run:
        description: "Reuse artifacts from this completed run (the release tag must identify its commit)"
        required: false
        type: string

permissions:
  contents: read

env:
  TAG: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}

jobs:
  select-hosts:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        env:
          SKIP_PLATFORM: ${{ inputs.skip_platform || 'none' }}
        run: |
          matrix=$(jq -cn --arg skip "$SKIP_PLATFORM" '
            {include: [
              {host: "aarch64-macos", runner: "macos-latest", platform: "macos"},
              {host: "x86_64-linux-gnu", runner: "ubuntu-latest", platform: "linux"},
              {host: "aarch64-linux-gnu", runner: "ubuntu-24.04-arm", platform: "linux"},
              {host: "x86_64-windows-msvc", runner: "windows-latest", platform: "windows"}
            ] | map(select(.platform != $skip))}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  build:
    needs: select-hosts
    if: ${{ !inputs.from_run }}
    name: Build ${{ matrix.host }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-hosts.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and pack
        shell: bash
        run: cargo xtask release "$RUNNER_TEMP/out" "${TAG#v}"

      - uses: actions/upload-artifact@v4
        with:
          name: klf-${{ matrix.host }}
          path: |
            ${{ runner.temp }}/out/*.tar.gz
            ${{ runner.temp }}/out/*.sha256
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    if: ${{ always() && !cancelled() && (needs.build.result == 'success' || (inputs.from_run != '' && needs.build.result == 'skipped')) && (github.event_name == 'push' || inputs.publish) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Verify reused artifacts
        if: inputs.from_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN: ${{ inputs.from_run }}
          SKIP_PLATFORM: ${{ inputs.skip_platform }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          tag_sha=$(gh api "repos/$GH_REPO/commits/$TAG" --jq '.sha')
          run=$(gh run view "$SOURCE_RUN" --json headSha,status,jobs)
          [[ $(jq -r '.status' <<< "$run") == completed ]]
          [[ $(jq -r '.headSha' <<< "$run") == "$tag_sha" ]]
          for host in aarch64-macos x86_64-linux-gnu aarch64-linux-gnu x86_64-windows-msvc; do
            case "$host:$SKIP_PLATFORM" in
              *-macos:macos|*-linux-gnu:linux|*-windows-msvc:windows) continue ;;
            esac
            jq -e --arg name "Build $host" '.jobs | any(.name == $name and .conclusion == "success")' <<< "$run" >/dev/null
          done
      - uses: actions/download-artifact@v4
        with:
          pattern: klf-*
          path: dist
          merge-multiple: true
          run-id: ${{ inputs.from_run || github.run_id }}
          github-token: ${{ github.token }}

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN: ${{ inputs.from_run }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if gh api "repos/$GH_REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
              if [ -z "$SOURCE_RUN" ]; then
                test "$(gh api "repos/$GH_REPO/commits/$TAG" --jq '.sha')" = "$GITHUB_SHA"
              fi
              gh release create "$TAG" --verify-tag --title "klf ${TAG#v}" \
                --notes "Install or update with \`klf setup\`, or \`knvm klf install latest\`."
            else
              gh release create "$TAG" --target "$GITHUB_SHA" --title "klf ${TAG#v}" \
                --notes "Install or update with \`klf setup\`, or \`knvm klf install latest\`."
            fi
          fi
          gh release upload "$TAG" dist/* --clobber
